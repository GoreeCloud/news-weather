health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect only approved durable News & Weather-owned state through accepted Everkeep contracts.
      - Treat feed/article caches and weather snapshots as bounded cache data unless a separate preservation requirement exists.
      - Exclude reusable secrets and unnecessary precise location data from ordinary backup payloads.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration of supported durable application state before Stable qualification.
      - Preserve privacy, account-optional behavior, and provider-replaceability during restore.
  export:
    required: true
    requirements:
      - Provide user-controlled export for subscriptions, folders, bookmarks, saved locations, and preferences where applicable.
      - Support OPML import/export for news subscriptions through the approved GoreeCloud Feeds boundary.
  portability:
    required: true
    requirements:
      - Keep provider-independent weather and application-domain models.
      - Avoid making one weather provider or one platform-specific storage format the permanent source of truth.

external_dependencies: []

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides:
    - news-weather-client

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - PROJECT-SPECIFICATIONS.md
    - docs/PLATFORM-INTEGRATIONS.md
  blockers:
    - No accepted Manager runtime integration.
    - No accepted Privacy Shield runtime integration.
    - No accepted Wardveil Security runtime integration.
    - No accepted Everkeep backup/restore integration.
    - GLAZE UI V1.6 adoption and downstream acceptance are incomplete.
    - Mesh applicability and runtime integration are incomplete.
    - Identity-backed synchronization integration is incomplete.
    - GoreeCloud Policy runtime integration is incomplete.
    - GoreeCloud Observability runtime integration is incomplete.
    - GoreeCloud Feeds runtime news integration is incomplete.
    - Weather-provider runtime integration is incomplete.
    - Android, Web, Linux, and Windows representative runtime acceptance is incomplete.
    - Release, signing, provenance, rollback, Production, and Stable qualification are incomplete.
